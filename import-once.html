const keyStatusEl = document.getElementById("keyStatus");
const btn = document.getElementById("importBtn");
const statusEl = document.getElementById("status");

const syncKey = window.localStorage.getItem("sync_key");

if (!syncKey) {
  keyStatusEl.innerHTML = '<span class="err">Aucune clé de synchronisation trouvée sur cet appareil. Ouvre d\'abord l\'application principale (dans ce même navigateur) puis reviens sur cette page.</span>';
} else {
  keyStatusEl.innerHTML = 'Clé détectée : <code>' + syncKey.slice(0, 8) + '…</code> — ' + IMPORT_DATA.expenses.length + ' dépenses et ' + IMPORT_DATA.incomes.length + ' revenus prêts à importer.';
  btn.disabled = false;
}

async function fetchExisting(key) {
  const res = await fetch(SUPABASE_URL + "/rest/v1/kv_store?sync_key=eq." + encodeURIComponent(syncKey) + "&key=eq." + key + "&select=value", {
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY },
  });
  if (!res.ok) throw new Error("Lecture impossible (" + key + ")");
  const rows = await res.json();
  return rows.length && Array.isArray(rows[0].value) ? rows[0].value : [];
}

async function upsert(key, value) {
  const res = await fetch(SUPABASE_URL + "/rest/v1/kv_store?on_conflict=sync_key,key", {
    method: "POST",
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: "Bearer " + SUPABASE_ANON_KEY,
      "Content-Type": "application/json",
      Prefer: "resolution=merge-duplicates",
    },
    body: JSON.stringify([{ sync_key: syncKey, key: key, value: value, updated_at: new Date().toISOString() }]),
  });
  if (!res.ok) throw new Error("Écriture impossible (" + key + "): " + (await res.text()));
}

btn.addEventListener("click", async () => {
  if (!window.confirm("Importer " + IMPORT_DATA.expenses.length + " dépenses et " + IMPORT_DATA.incomes.length + " revenus dans ta base ? Elles s'ajouteront à ce qui existe déjà.")) return;
  btn.disabled = true;
  statusEl.textContent = "Import en cours…";
  try {
    const existingExpenses = await fetchExisting("expenses");
    const existingIncomes = await fetchExisting("incomes");
    const mergedExpenses = existingExpenses.concat(IMPORT_DATA.expenses);
    const mergedIncomes = existingIncomes.concat(IMPORT_DATA.incomes);
    await upsert("expenses", mergedExpenses);
    await upsert("incomes", mergedIncomes);
    
    statusEl.innerHTML = '<span class="ok">Import terminé ! ' + IMPORT_DATA.expenses.length + ' dépenses et ' + IMPORT_DATA.incomes.length + ' revenus ajoutés (total désormais ' + mergedExpenses.length + ' / ' + mergedIncomes.length + ' en base).\n\nTu peux retourner sur l\'application principale et actualiser la page.</span>';
  } catch (err) {
    statusEl.innerHTML = '<span class="err">Erreur : ' + err.message + '</span>';
    btn.disabled = false;
  }
});
